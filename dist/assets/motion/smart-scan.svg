<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Smart Scan fills a progress ring and checks junk, security, speed and apps">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
.ring{stroke-dasharray:283;stroke-dashoffset:283;animation:fill 7s cubic-bezier(.4,0,.2,1) infinite}
@keyframes fill{0%{stroke-dashoffset:283}45%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.scan{animation:scan 7s infinite}.done{opacity:0;animation:done 7s infinite}
@keyframes scan{0%,40%{opacity:1}46%,100%{opacity:0}}
@keyframes done{0%,44%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.row{opacity:.35;animation:row 7s infinite}.chk{opacity:0;animation:chk 7s infinite}
.r2{animation-delay:.6s}.r3{animation-delay:1.2s}.r4{animation-delay:1.8s}
@keyframes row{0%,8%{opacity:.35}14%,90%{opacity:1}100%{opacity:.35}}
@keyframes chk{0%,10%{opacity:0;transform:scale(.4)}16%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
.chk{transform-box:fill-box;transform-origin:center}
.btn{opacity:0;animation:done 7s infinite}
@media (prefers-reduced-motion:reduce){.ring{animation:none;stroke-dashoffset:0}.scan{display:none}.done,.row,.chk,.btn{animation:none;opacity:1}}
</style>
<rect width="480" height="300" rx="16" fill="#0c1019"/>
<rect x=".5" y=".5" width="479" height="299" rx="16" fill="none" stroke="#ffffff14"/>
<circle cx="20" cy="18" r="4.5" fill="#ff5f57"/><circle cx="34" cy="18" r="4.5" fill="#febc2e"/><circle cx="48" cy="18" r="4.5" fill="#28c840"/>
<text x="240" y="22" fill="#9299ae" font-size="11" text-anchor="middle">MacSweep — Smart Scan</text>
<line x1="0" y1="36" x2="480" y2="36" stroke="#ffffff10"/>
<circle cx="130" cy="160" r="45" fill="none" stroke="#ffffff12" stroke-width="10"/>
<circle class="ring" cx="130" cy="160" r="45" fill="none" stroke="#34c759" stroke-width="10" stroke-linecap="round" transform="rotate(-90 130 160)"/>
<g class="scan"><text x="130" y="158" fill="#f0f3ff" font-size="14" font-weight="600" text-anchor="middle">Scanning</text><text x="130" y="175" fill="#9299ae" font-size="10" text-anchor="middle">your Mac…</text></g>
<g class="done"><text x="130" y="162" fill="#f0f3ff" font-size="20" font-weight="700" text-anchor="middle">12.1 GB</text><text x="130" y="178" fill="#9299ae" font-size="10" text-anchor="middle">safe to remove</text></g>
<g class="btn"><rect x="88" y="232" width="84" height="26" rx="8" fill="#34c759"/><text x="130" y="249" fill="#06210f" font-size="11.5" font-weight="700" text-anchor="middle">Clean</text></g>
<g font-size="12">
<g class="row"><rect x="236" y="64" width="216" height="44" rx="10" fill="#111622" stroke="#ffffff10"/><text x="252" y="83" fill="#f0f3ff" font-weight="600">Junk files</text><text x="252" y="99" fill="#9299ae" font-size="10">12.1 GB found</text><g class="chk"><circle cx="430" cy="86" r="9" fill="#34c759"/><path d="M425.5 86l3 3 6-6" stroke="#06210f" stroke-width="2" fill="none" stroke-linecap="round"/></g></g>
<g class="row r2"><rect x="236" y="116" width="216" height="44" rx="10" fill="#111622" stroke="#ffffff10"/><text x="252" y="135" fill="#f0f3ff" font-weight="600">Security</text><text x="252" y="151" fill="#9299ae" font-size="10">No threats</text><g class="chk r2"><circle cx="430" cy="138" r="9" fill="#34c759"/><path d="M425.5 138l3 3 6-6" stroke="#06210f" stroke-width="2" fill="none" stroke-linecap="round"/></g></g>
<g class="row r3"><rect x="236" y="168" width="216" height="44" rx="10" fill="#111622" stroke="#ffffff10"/><text x="252" y="187" fill="#f0f3ff" font-weight="600">Speed</text><text x="252" y="203" fill="#9299ae" font-size="10">3 tips</text><g class="chk r3"><circle cx="430" cy="190" r="9" fill="#34c759"/><path d="M425.5 190l3 3 6-6" stroke="#06210f" stroke-width="2" fill="none" stroke-linecap="round"/></g></g>
<g class="row r4"><rect x="236" y="220" width="216" height="44" rx="10" fill="#111622" stroke="#ffffff10"/><text x="252" y="239" fill="#f0f3ff" font-weight="600">Apps</text><text x="252" y="255" fill="#9299ae" font-size="10">2 updates</text><g class="chk r4"><circle cx="430" cy="242" r="9" fill="#34c759"/><path d="M425.5 242l3 3 6-6" stroke="#06210f" stroke-width="2" fill="none" stroke-linecap="round"/></g></g>
</g>
</svg>
