<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Junk items are ticked and move to the Trash, freeing 9.9 GB">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
.item{animation:fly 8s cubic-bezier(.5,0,.3,1) infinite;transform-box:fill-box}
.i2{animation-delay:.25s}.i3{animation-delay:.5s}.i4{animation-delay:.75s}
@keyframes fly{0%,42%{transform:translate(0,0) scale(1);opacity:1}58%{transform:translate(250px,40px) scale(.15);opacity:0}96%{transform:translate(250px,40px) scale(.15);opacity:0}100%{transform:none;opacity:1}}
.tick{opacity:0;animation:tick 8s infinite}.t2{animation-delay:.35s}.t3{animation-delay:.7s}.t4{animation-delay:1.05s}
@keyframes tick{0%,8%{opacity:0}14%,96%{opacity:1}100%{opacity:0}}
.lid{transform-origin:418px 150px;animation:lid 8s infinite}
@keyframes lid{0%,40%{transform:rotate(0)}46%,60%{transform:rotate(-22deg)}66%,100%{transform:rotate(0)}}
.freed{opacity:0;animation:freed 8s infinite}
@keyframes freed{0%,60%{opacity:0;transform:translateY(8px)}66%,92%{opacity:1;transform:none}100%{opacity:0}}
.sel{animation:sel 8s infinite}@keyframes sel{0%,40%{opacity:1}46%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.item,.lid,.sel{animation:none}.tick,.freed{animation:none;opacity:1}}
</style>
<rect width="480" height="300" rx="16" fill="#0c1019"/>
<rect x=".5" y=".5" width="479" height="299" rx="16" fill="none" stroke="#ffffff14"/>
<circle cx="20" cy="18" r="4.5" fill="#ff5f57"/><circle cx="34" cy="18" r="4.5" fill="#febc2e"/><circle cx="48" cy="18" r="4.5" fill="#28c840"/>
<text x="240" y="22" fill="#9299ae" font-size="11" text-anchor="middle">MacSweep — Space &amp; Junk</text>
<line x1="0" y1="36" x2="480" y2="36" stroke="#ffffff10"/>
<rect x="24" y="52" width="92" height="20" rx="10" fill="#34c75922"/><text x="70" y="66" fill="#6ee28b" font-size="10.5" font-weight="600" text-anchor="middle">Safe to remove</text>
<g font-size="12">
<g class="item"><rect x="24" y="84" width="280" height="40" rx="10" fill="#111622" stroke="#ffffff10"/><rect x="38" y="97" width="14" height="14" rx="4" fill="none" stroke="#ffffff40"/><g class="tick"><rect x="38" y="97" width="14" height="14" rx="4" fill="#34c759"/><path d="M41.5 104l2.5 2.5 4.5-4.5" stroke="#06210f" stroke-width="1.8" fill="none"/></g><text x="64" y="108" fill="#f0f3ff">npm cache</text><text x="288" y="108" fill="#9299ae" text-anchor="end">2.35 GB</text></g>
<g class="item i2"><rect x="24" y="130" width="280" height="40" rx="10" fill="#111622" stroke="#ffffff10"/><rect x="38" y="143" width="14" height="14" rx="4" fill="none" stroke="#ffffff40"/><g class="tick t2"><rect x="38" y="143" width="14" height="14" rx="4" fill="#34c759"/><path d="M41.5 150l2.5 2.5 4.5-4.5" stroke="#06210f" stroke-width="1.8" fill="none"/></g><text x="64" y="154" fill="#f0f3ff">Xcode DerivedData</text><text x="288" y="154" fill="#9299ae" text-anchor="end">4.10 GB</text></g>
<g class="item i3"><rect x="24" y="176" width="280" height="40" rx="10" fill="#111622" stroke="#ffffff10"/><rect x="38" y="189" width="14" height="14" rx="4" fill="none" stroke="#ffffff40"/><g class="tick t3"><rect x="38" y="189" width="14" height="14" rx="4" fill="#34c759"/><path d="M41.5 196l2.5 2.5 4.5-4.5" stroke="#06210f" stroke-width="1.8" fill="none"/></g><text x="64" y="200" fill="#f0f3ff">Browser caches</text><text x="288" y="200" fill="#9299ae" text-anchor="end">2.90 GB</text></g>
<g class="item i4"><rect x="24" y="222" width="280" height="40" rx="10" fill="#111622" stroke="#ffffff10"/><rect x="38" y="235" width="14" height="14" rx="4" fill="none" stroke="#ffffff40"/><g class="tick t4"><rect x="38" y="235" width="14" height="14" rx="4" fill="#34c759"/><path d="M41.5 242l2.5 2.5 4.5-4.5" stroke="#06210f" stroke-width="1.8" fill="none"/></g><text x="64" y="246" fill="#f0f3ff">Old CLI versions</text><text x="288" y="246" fill="#9299ae" text-anchor="end">0.55 GB</text></g>
</g>
<g class="sel"><text x="390" y="250" fill="#9299ae" font-size="11" text-anchor="middle">4 selected · 9.9 GB</text></g>
<g stroke="#9299ae" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M396 156h44l-4 58a6 6 0 0 1-6 5.5h-24a6 6 0 0 1-6-5.5z" fill="#111622"/>
<path d="M410 170v36M418 170v36M426 170v36" stroke-width="1.6" stroke="#9299ae88"/>
<g class="lid"><path d="M390 150h56"/><path d="M410 150v-6h16v6"/></g>
</g>
<g class="freed"><text x="418" y="118" fill="#6ee28b" font-size="20" font-weight="700" text-anchor="middle">+9.9 GB</text><text x="418" y="134" fill="#9299ae" font-size="10.5" text-anchor="middle">moved to the Trash</text></g>
</svg>
